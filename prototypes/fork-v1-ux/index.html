<script id="prototype-model">
// Throwaway interaction model. It does not import or mutate production code.
// Question: do the approved canvas, draft, path and reading rules work together
// across alternative exploration, concept learning and parallel work?
const Model = (() => {
  const CW=258, CH=230, DH=318, DX=330, DY=370;
  const turn=(s,id)=>s.turns.find(t=>t.id===id);
  const draft=(s,id)=>s.drafts.find(d=>d.id===id);
  const conv=(s,id)=>s.conversations.find(c=>c.id===id);
  function path(s,id){const r=[],seen=new Set();while(id&&!seen.has(id)){seen.add(id);const t=turn(s,id);if(!t)break;r.unshift(t);id=t.parent;}return r;}
  const members=(s,id)=>s.conversations.filter(c=>path(s,c.tip).some(t=>t.id===id));
  function descendants(s,id){const found=new Set();let changed=true;while(changed){changed=false;for(const t of s.turns)if(t.parent&&(t.parent===id||found.has(t.parent))&&!found.has(t.id)){found.add(t.id);changed=true;}}return found;}
  function hidden(s){const ids=new Set();for(const id of s.collapsed){const ds=descendants(s,id);for(const t of ds)ids.add(t);for(const d of s.drafts)if(d.from&&(d.from===id||ds.has(d.from)))ids.add(d.id);}return ids;}
  function reveal(s,kind,id){const obj=kind==='turn'?turn(s,id):draft(s,id);const ancestors=path(s,kind==='turn'?obj?.parent:obj?.from).map(t=>t.id);s.collapsed=s.collapsed.filter(x=>!ancestors.includes(x));}
  function slot(s,x,y,height=DH){const objects=[...s.turns,...s.drafts];while(objects.some(o=>Math.abs(o.x-x)<CW+35&&y<o.y+(o.kind?DH:CH)+45&&y+height+45>o.y))y+=DY;return {x,y};}
  function record(s,msg){s.events.unshift(msg);s.events=s.events.slice(0,20);}
  function newState(){return {version:1,seq:0,turns:[],conversations:[],drafts:[],admissions:{},collapsed:[],selected:null,activeConv:null,contextConv:null,memories:{},reading:{},view:{x:55,y:110,z:.78},focus:false,undo:[],redo:[],events:[],notices:[],guide:{step:0,refs:{}}};}
  function reduce(original,a){const s=structuredClone(original);const id=p=>p+(++s.seq);const object=i=>turn(s,i)||draft(s,i);
    if(a.type==='NEW'){const bottom=Math.max(-DY,...s.turns.map(t=>t.y),...s.drafts.map(d=>d.y));const d={id:id('D'),kind:'new',from:null,convId:null,prompt:'',model:'prototype-text',mode:'normal',error:'',x:70,y:bottom+DY};s.drafts.push(d);s.selected={kind:'draft',id:d.id};s.activeConv=null;record(s,'New Chat：新增独立待输入卡，尚无正式 Conversation。');}
    if(a.type==='FORK'){const t=turn(s,a.id);if(!t||t.status!=='completed')return original;const d={id:id('D'),kind:'fork',from:t.id,convId:null,prompt:'',model:t.model,mode:'normal',error:'',...slot(s,t.x+DX,t.y+DY)};s.drafts.push(d);s.selected={kind:'draft',id:d.id};s.activeConv=null;reveal(s,'draft',d.id);record(s,`从 ${t.label} 创建独立草稿；继承 ${path(s,t.id).length} 轮，未创建正式对话。`);}
    if(a.type==='CONTINUE'){const c=conv(s,a.id);if(!c||turn(s,c.tip)?.status==='generating')return original;let d=s.drafts.find(d=>d.kind==='continue'&&d.convId===c.id);if(!d){const p=turn(s,c.tip);d={id:id('D'),kind:'continue',from:p.id,convId:c.id,prompt:'',model:p.model,mode:'normal',error:'',...slot(s,p.x+DX,p.y)};s.drafts.push(d);}s.selected={kind:'draft',id:d.id};s.activeConv=c.id;s.contextConv=c.id;reveal(s,'draft',d.id);record(s,`继续「${c.name}」末尾；恢复或创建该对话唯一一份待发送续写。`);}
    if(a.type==='SELECT'){const o=object(a.id);if(!o)return original;s.selected={kind:a.kind,id:a.id};reveal(s,a.kind,a.id);if(a.kind==='turn'){const ms=members(s,a.id);if(s.contextConv&&ms.some(c=>c.id===s.contextConv))s.memories[s.contextConv]=a.id;s.activeConv=ms.length===1?ms[0].id:null;if(ms.length===1){s.contextConv=ms[0].id;s.memories[ms[0].id]=a.id;}record(s,ms.length>1?`阅读共享 ${o.label}；继续时需选择目标路径。`:`阅读 ${o.label}，切换至其所在路径。`);}else s.activeConv=o.kind==='continue'?o.convId:null;}
    if(a.type==='ACTIVATE'){const c=conv(s,a.id);if(!c)return original;const remembered=s.memories[c.id];const selected=path(s,c.tip).some(t=>t.id===remembered)?remembered:c.tip;s.selected={kind:'turn',id:selected};s.activeConv=c.id;s.contextConv=c.id;reveal(s,'turn',selected);record(s,`切回「${c.name}」，恢复该路径上次阅读的节点与阅读位置。`);}
    if(a.type==='EDIT'){const d=draft(s,a.id);if(!d)return original;d.prompt=a.value;d.error='';}
    if(a.type==='MODE'){const d=draft(s,a.id);if(d){d.mode=a.value;d.error='';}}
    if(a.type==='SUBMIT'){const d=draft(s,a.id);if(!d||!d.prompt.trim()||s.admissions[a.id])return original;
      if(d.mode==='blocked-model'||d.mode==='blocked-capacity'){d.error=d.mode==='blocked-model'?'模拟限制：所选模型不可用。内容已保留，请在“模拟条件”中改为正常生成后重试。':'模拟限制：完整历史与新问题超过容量。内容已保留；本原型不进行真实 Token 计数，请改为正常生成后重试。';record(s,'提交前阻止：草稿保留，没有新增 Conversation 或 Turn。');return s;}
      let c=d.kind==='continue'?conv(s,d.convId):null;if(d.kind==='continue'&&(!c||turn(s,c.tip)?.status==='generating')){d.error='当前对话仍在生成，请结束本轮后再提交。';return s;}
      const tid=id('T'),parent=d.kind==='new'?null:d.from;const t={id:tid,label:tid,parent,prompt:d.prompt,response:'',status:'generating',provider:'prototype-provider',model:d.model,x:d.x,y:d.y,simulation:d.mode};s.turns.push(t);
      if(!c){c={id:id('C'),name:d.prompt.trim().replace(/\s+/g,' ').slice(0,22),kind:d.kind==='new'?'independent':'forked',tip:tid};if(d.kind==='fork')c.forkFromTurnId=d.from;s.conversations.push(c);}else c.tip=tid;
      s.admissions[d.id]={convId:c.id,turnId:tid};s.drafts=s.drafts.filter(x=>x.id!==d.id);for(const entry of [...s.undo,...s.redo])for(const point of [...entry.before,...entry.after])if(point.id===d.id)point.id=tid;s.selected={kind:'turn',id:tid};s.activeConv=c.id;s.contextConv=c.id;s.memories[c.id]=tid;s.reading[tid]={top:0,follow:true};record(s,`Prompt 已接纳：${c.id} / ${tid} 已成立；独立模拟任务开始，草稿不再可提交。`);
    }

  a:[['New Chat：准备独立问题','点击后只产生输入卡，观察正式对话数量仍为 0。'],['提交第一条问题','可以自行修改问题，再按“发送”；也可用此按钮提交演示问题。'],['在原 Conversation 继续第二轮','观察 Conversation 身份不变，只新增一个 Turn。'],['继续第三轮，形成历史位置','之后将从第二轮分出去，检验不会继承第三轮。'],['从第二轮 Fork，保留草稿','高亮根至第二轮；当前正式对话仍只有原路径。'],['编辑并提交替代方案','可先在两处编辑，检查内容同步，再提交。'],['切回原 Conversation','恢复上次阅读位置，原路径仍保留三轮。']],
  b:[['从概念所在的历史 Turn Fork','从第二轮的“幂等性”说明进入学习分支。'],['提交概念学习问题','观察新路径继承根至第二轮，不含第三轮。'],['在学习分支继续追问','沿该 Conversation 新增下一轮，不再创建另一条 Conversation。'],['返回原路径的阅读位置','原路径仍有三轮，历史身份和内容保持不变。']],
  c:[['从第一轮准备方向一','先创建草稿，不提交；观察待发送入口。'],['同一起点准备方向二','同一历史 Turn 允许多个独立草稿。'],['从第二轮准备方向三','三个输入各自保存，不相互覆盖。'],['从待发送恢复方向一','先切走，再恢复第一份草稿；检查原问题还在。'],['提交方向一','分支成立并开始模拟生成。'],['立即提交方向二','可与方向一同时生成，分别归属自己的 Conversation。'],['回到尚未提交的方向三','阅读或编辑这份草稿；其他任务完成时不抢占当前选择。'],['继续已完成的方向一','保留方向三草稿，再在方向一准备下一轮续写。']]
};
function renderGuide(){const k=workspace.split('-')[0],steps=environment.activeProjectId===environment.guideProjectId?GUIDE_STEPS[k]:null;if(!steps){$('#guideHost').innerHTML=`<div class="guide"><div class="guide-head"><strong>当前项目：${esc(currentProject().name)}</strong>${button('about','查看说明','','small quiet')}</div><div class="guide-body"><div class="guide-help">此项目的对话、草稿、地图与阅读现场独立保存。可用 New Chat 开始，或切换项目后再回来验证恢复。完整引导请从顶部“验证流程”进入。</div><div class="legend tiny"><span><i class="swatch"></i>正式 Turn</span><span><i class="swatch draft"></i>未提交</span><span><i class="swatch inherit"></i>继承路径</span></div></div></div>`;return;}
  const ix=state.guide.step,done=ix>=steps.length;$('#guideHost').innerHTML=`<div class="guide"><div class="guide-head"><strong>${scenarioNames[scenarioIndex()]}</strong><span class="guide-progress">${Math.min(ix+1,steps.length)} / ${steps.length}</span>${button('guide-min',ui.guideMin?'展开':'收起','','small quiet')}</div>${ui.guideMin?'':`<div class="guide-body">${done?'<div class="walk-complete">✓ 引导步骤已完成，可以继续自由操作。</div><div class="guide-help">打开“状态”检查共享身份、原路径与待发送内容。你的主观体验仍需亲自验证。</div>':`<div class="guide-step">${ix+1}. ${steps[ix][0]}</div><div class="guide-help">${steps[ix][1]}</div>`}<div class="guide-controls">${done?'':button('guide-next','执行此步骤','','primary')}${[...tasks.values()].some(t=>t.projectId===environment.activeProjectId)?button('fast-forward','快进模拟回复','','small'):''}${button('restart-guide','从头重演','','small')}</div><div class="step-note">引导使用与自由操作相同的创建、Fork、提交和导航操作。可随时改用画布、输入框及导航实际操作。</div></div>`}</div>`;
}
function loadScenario(index,restart=false){saveReading();save();const base=['free','a','b','c'][index];workspace=restart?`${base}-${Date.now()}`:base;environment=loadEnvironment();state=currentProject().state;state.guide??={step:0,refs:{}};tasks.clear();for(const p of environment.projects)for(const t of p.state.turns)startTask(t,p.id);ui.group=[];ui.tool=state.sessionUI?.tool||'select';ui.guideMin=state.sessionUI?.guideMin||false;ui.readerKey=null;ui.toasts=[];renderToasts();closeModal();updateURL();save();render();}
function fillAndSubmit(id,text){if(!id)return false;if(!draft(id)?.prompt.trim())dispatch({type:'EDIT',id,value:text},false);submit(id);return !!state.admissions[id];}
function guideNext(){const k=workspace.split('-')[0],g=state.guide,r=g.refs,main=conv(r.main),busy=id=>turn(conv(id)?.tip)?.status==='generating';let ok=true;
  if(k==='a'){
    if(g.step===0)r.new=newChat();
    if(g.step===1){ok=fillAndSubmit(r.new,'我想设计一个本地知识整理工具，先帮我拆解问题。');if(ok)r.main=state.admissions[r.new].convId;}
    if(g.step===2){if(busy(r.main))ok=false;else ok=fillAndSubmit(continueConversation(r.main),'请比较集中存储与本地优先两种方案，并解释幂等性。');}
    if(g.step===3){if(busy(r.main))ok=false;else ok=fillAndSubmit(continueConversation(r.main),'如果选择本地优先，第一版应该怎样逐步验证？');}
    if(g.step===4){if(busy(r.main))ok=false;else{const origin=Model.path(state,conv(r.main).tip)[1];activate(r.main);selectObject('turn',origin.id);r.fork=fork(origin.id);dispatch({type:'EDIT',id:r.fork,value:'如果改用集中存储，最小验证方案会有什么不同？'});}}
    if(g.step===5)ok=fillAndSubmit(r.fork,'如果改用集中存储，最小验证方案会有什么不同？');
    if(g.step===6)activate(r.main);
  }
  if(k==='b'){
    if(g.step===0){activate(r.main);const origin=Model.path(state,main.tip)[1];selectObject('turn',origin.id);r.fork=fork(origin.id);}
    if(g.step===1){ok=fillAndSubmit(r.fork,'什么是幂等性？请用日常例子解释，再联系这次方案。');if(ok)r.branch=state.admissions[r.fork].convId;}
    if(g.step===2){if(busy(r.branch))ok=false;else ok=fillAndSubmit(continueConversation(r.branch),'如果重复点击发生在保存完成之前，又该怎样理解？');}
    if(g.step===3)activate(r.main);
  }
  if(k==='c'){
    const p=Model.path(state,main?.tip);
    if(g.step===0){r.d1=fork(p[0].id);dispatch({type:'EDIT',id:r.d1,value:'从成本角度比较这两种方案。'});}
    if(g.step===1){r.d2=fork(p[0].id);dispatch({type:'EDIT',id:r.d2,value:'从可靠性角度比较这两种方案。'});}
    if(g.step===2){r.d3=fork(p[1].id);dispatch({type:'EDIT',id:r.d3,value:'详细解释缓存一致性，稍后继续准备这个问题。'});}
    if(g.step===3){activate(r.main);selectObject('draft',r.d1);}
    if(g.step===4){ok=fillAndSubmit(r.d1,'从成本角度比较这两种方案。');if(ok)r.branch=state.admissions[r.d1].convId;}
    if(g.step===5)ok=fillAndSubmit(r.d2,'从可靠性角度比较这两种方案。');
    if(g.step===6)selectObject('draft',r.d3);
    if(g.step===7){if(busy(r.branch))ok=false;else{const id=continueConversation(r.branch);dispatch({type:'EDIT',id,value:'进一步说明长期维护成本，先保留这份续写。'});}}
  }
  // Dispatch replaces state. Merge guide references back into the current copy.
  state.guide={step:g.step+(ok?1:0),refs:r};save();render();if(!ok)toast('本轮仍在生成。可以等待，或点击“快进模拟回复”后继续。');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const a=b.dataset.action,id=b.dataset.id;if(b.disabled)return;e.stopPropagation();
  if(['new','activate','select-draft'].includes(a)&&ui.modal)closeModal();if(a==='navigation')navigation();if(a==='projects')showProjects();if(a==='switch-project')switchProject(id);if(a==='new-project')newProjectDialog();if(a==='create-project')createProject();if(a==='scenarios')showScenarios();if(a==='new')newChat();if(a==='fork')fork(id);if(a==='continue')continueFromTurn(id);if(a==='submit')submit(id);if(a==='select-turn'&&id)selectObject('turn',id);if(a==='select-draft')selectObject('draft',id);if(a==='activate')activate(id);
  if(a==='choose-continue'){closeModal();continueConversation(id);}if(a==='pending')showPending();if(a==='pending-open'){closeModal();selectObject('draft',id);focusEditor();}if(a==='collapse')dispatch({type:'COLLAPSE',id});if(a==='group')groupDownstream(id);if(a==='discard')discard(id);if(a==='confirm-discard'){closeModal();dispatch({type:'DISCARD',id});}if(a==='stop')finishTask(id,'stopped');if(a==='about')about();if(a==='inspect')inspector();if(a==='close-modal')closeModal();
  if(a==='tool'){ui.tool=b.dataset.tool;ui.group=[];renderCanvas();save();}if(a==='zoom')zoom(Number(b.dataset.factor));if(a==='fit')fit();if(a==='locate')ensureVisible(true);if(a==='undo')dispatch({type:'UNDO'});if(a==='redo')dispatch({type:'REDO'});
  if(a==='focus'){saveReading();state.focus=!state.focus;save();render();if(!state.focus)ensureVisible();}
  if(a==='latest'){state.reading[id]={top:$('#readerBody').scrollHeight,follow:true};$('#readerBody').scrollTop=$('#readerBody').scrollHeight;save();b.textContent='跟随最新';b.classList.remove('off');}
  if(a==='next'){const cs=state.turns.filter(t=>t.parent===id);if(cs.length===1)selectObject('turn',cs[0].id);else openModal('选择下一轮阅读',cs.map(t=>button('read-next',esc(t.label)+' · '+esc(clip(t.prompt,50)),`data-id="${t.id}"`,'chooser')).join(''));}if(a==='read-next'){closeModal();selectObject('turn',id);}
  if(a==='rename'){openModal('修改对话路径名称',`<input class="rename-input" id="renameInput" aria-label="路径名称" value="${esc(conv(id)?.name)}"><div class="reader-actions">${button('confirm-rename','保存名称',`data-id="${id}"`,'primary')}</div>`);}if(a==='confirm-rename'){dispatch({type:'RENAME',id,value:$('#renameInput').value});closeModal();}
  if(a==='scenario')loadScenario(Number(b.dataset.index));if(a==='restart-guide')loadScenario(scenarioIndex(),true);if(a==='guide-next')guideNext();if(a==='guide-min'){ui.guideMin=!ui.guideMin;renderGuide();save();}if(a==='fast-forward')for(const task of [...tasks.values()].filter(t=>t.projectId===environment.activeProjectId))finishTask(task.id);
  if(a==='toast-turn'){ui.toasts=[];renderToasts();switchProject(b.dataset.project);selectObject('turn',id);}if(a==='toast-close'){ui.toasts=ui.toasts.filter(t=>String(t.id)!==id);renderToasts();}return;
  }
  const card=e.target.closest('[data-card]');if(card&&!e.target.closest('textarea,select,input')&&!ui.justDragged){if(window.getSelection()?.toString())return;if(e.shiftKey){ui.group=ui.group.includes(card.dataset.card)?ui.group.filter(i=>i!==card.dataset.card):[...ui.group,card.dataset.card];renderCanvas();}else if(state.selected?.id!==card.dataset.card||card.dataset.kind==='turn'&&Model.members(state,card.dataset.card).length>1)selectObject(card.dataset.kind,card.dataset.card);}
});
document.addEventListener('input',e=>{const el=e.target;if(!el.matches('textarea[data-editor]'))return;const id=el.dataset.editor;state=Model.reduce(state,{type:'EDIT',id,value:el.value});$$(`textarea[data-editor="${id}"]`).forEach(other=>{if(other!==el)other.value=el.value;});$$(`[data-action="submit"][data-id="${id}"]`).forEach(b=>b.disabled=!el.value.trim());$$(`[data-error="${id}"]`).forEach(n=>{n.innerHTML='';n.classList.remove('error');});renderNav();save();});
document.addEventListener('change',e=>{if(e.target.matches('[data-project-switch]'))switchProject(e.target.value);if(e.target.dataset.mode)dispatch({type:'MODE',id:e.target.dataset.mode,value:e.target.value});});
document.addEventListener('compositionstart',()=>ui.composing=true);document.addEventListener('compositionend',()=>{ui.composing=false;if(ui.renderQueued){ui.renderQueued=false;render();}});
$('#readerBody').addEventListener('scroll',()=>{if(!ui.readerKey)return;const isTurn=ui.readerKey.startsWith('turn:'),id=isTurn?ui.readerKey.slice(5):ui.readerKey,el=$('#readerBody'),follow=el.scrollHeight-el.clientHeight-el.scrollTop<35;state.reading[id]={top:el.scrollTop,follow};const b=isTurn?$('[data-action="latest"]'):null;if(b){b.textContent=follow?'跟随最新':'回到最新内容';b.classList.toggle('off',!follow);}clearTimeout(saveTimer);saveTimer=setTimeout(save,160);});
$('#viewport').addEventListener('wheel',e=>{if(e.target.closest('textarea'))return;e.preventDefault();if(e.ctrlKey||e.metaKey){const r=e.currentTarget.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.003),e.clientX-r.left,e.clientY-r.top);}else{state.view.x-=e.shiftKey?e.deltaY:e.deltaX;state.view.y-=e.shiftKey?0:e.deltaY;drawView();save();}},{passive:false});
$('#viewport').addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==1)return;const pan=ui.space||ui.tool==='hand'||e.button===1,handle=e.target.closest('[data-drag]');if(!pan&&!handle)return;if(e.target.closest('textarea,button,select'))return;e.preventDefault();const start={x:e.clientX,y:e.clientY};if(pan){ui.drag={kind:'pan',start,vx:state.view.x,vy:state.view.y};$('#viewport').classList.add('panning');}else{const id=handle.dataset.drag;if(!ui.group.includes(id)){if(state.selected?.id!==id)dispatch({type:'SELECT',kind:draft(id)?'draft':'turn',id});ui.group=[];}ui.drag={kind:'move',start,ids:ui.group.length?[...ui.group]:[id],dx:0,dy:0};}
});
window.addEventListener('pointermove',e=>{const d=ui.drag;if(!d)return;if(d.kind==='pan'){state.view.x=d.vx+e.clientX-d.start.x;state.view.y=d.vy+e.clientY-d.start.y;drawView();}else{d.dx=(e.clientX-d.start.x)/state.view.z;d.dy=(e.clientY-d.start.y)/state.view.z;renderCanvas();}});
window.addEventListener('pointerup',()=>{const d=ui.drag;if(!d)return;ui.drag=null;$('#viewport').classList.remove('panning');const moved=d.kind==='move'&&Math.abs(d.dx)+Math.abs(d.dy)>3;ui.justDragged=moved;if(moved)dispatch({type:'MOVE',ids:d.ids,dx:d.dx,dy:d.dy});else{save();renderCanvas();}setTimeout(()=>ui.justDragged=false,80);});
document.addEventListener('keydown',e=>{const typing=e.target.closest('input,textarea,[contenteditable="true"]');if(typing)return;if(e.key==='Escape'){closeModal();ui.group=[];renderCanvas();}if(e.code==='Space'){e.preventDefault();ui.space=true;drawView();}if(e.key.toLowerCase()==='h'){ui.tool='hand';renderCanvas();}if(e.key.toLowerCase()==='v'){ui.tool='select';renderCanvas();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();dispatch({type:e.shiftKey?'REDO':'UNDO'});}if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();dispatch({type:'REDO'});}});
document.addEventListener('keyup',e=>{if(e.code==='Space'){ui.space=false;drawView();}});window.addEventListener('blur',()=>{ui.space=false;ui.drag=null;drawView();});window.addEventListener('beforeunload',()=>{saveReading();save();});
for(const p of environment.projects)for(const t of p.state.turns)startTask(t,p.id);render();save();
</script>
</body></html>
